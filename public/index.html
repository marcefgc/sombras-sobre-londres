<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sombras sobre Londres</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <img class="splat s1" src="assets/decor/blood-splatter-3.png" alt="" />
  <img class="splat s2" src="assets/decor/blood-spray.png" alt="" />
  <img class="splat s3" src="assets/decor/blood-splatter-1.png" alt="" />

  <!-- LOBBY -->
  <section id="lobby">
    <h1>Sombras sobre Londres</h1>
    <input id="name" placeholder="Tu nombre" />
    <select id="role">
      <option value="jack">Jack el Destripador</option>
      <option value="police">Policía</option>
      <option value="spectator">Espectador</option>
    </select>
    <div id="colorPick" hidden>
      <label class="mode-label">FICHAS QUE CONTROLAS</label>
      <div id="colorRow" class="color-row">
        <label><input type="checkbox" class="colorChk" value="blue" /> <span class="cdot" data-c="blue"></span> Azul</label>
        <label><input type="checkbox" class="colorChk" value="green" /> <span class="cdot" data-c="green"></span> Verde</label>
        <label><input type="checkbox" class="colorChk" value="red" /> <span class="cdot" data-c="red"></span> Rojo</label>
        <label><input type="checkbox" class="colorChk" value="yellow" /> <span class="cdot" data-c="yellow"></span> Amarillo</label>
        <label><input type="checkbox" class="colorChk" value="purple" /> <span class="cdot" data-c="purple"></span> Morado</label>
      </div>
      <small id="colorHint" style="color:#5a3d22;">Si juegas solo de policía, marca las 5. Con más amigos, repártanse.</small>
    </div>
    <label class="mode-label">MODO DE JUEGO</label>
    <select id="mode">
      <option value="manual">Partida — fichas libres (manual)</option>
      <option value="referee">Aprendizaje — el árbitro valida todo</option>
    </select>
    <button id="joinBtn">Entrar</button>
    <button id="rulesLobbyBtn" type="button" class="ghost">📖 Leer las reglas</button>
  </section>

  <!-- JUEGO -->
  <section id="game" hidden>
    <header id="statusBar">
      <span id="nightLabel"></span>
      <span id="phaseLabel"></span>
      <span id="movesLabel"></span>
      <button id="resetBtn">Reiniciar</button>
    </header>

    <div id="layout">
      <div id="boardWrap">
        <img id="mapImg" src="assets/mapa-oficial.png" alt="Mapa de Whitechapel" />
        <div id="tokenLayer"></div>
        <div id="nodeLayer" hidden></div>
        <div id="coach" hidden>
          <span id="coachIcon">🎓</span>
          <span id="coachText"></span>
          <button id="coachHide" type="button" title="Ocultar consejo">✕</button>
        </div>
        <button id="coachReopen" type="button" hidden title="Mostrar consejos">💡</button>
      </div>

      <aside id="sidebar">
        <div id="controls"></div>
        <div id="jackPanel" hidden></div>
        <h3>Registro</h3>
        <ul id="log"></ul>
      </aside>
    </div>

    <footer id="bottomBar">
      <span class="bb-title">Sombras sobre Londres</span>
      <button id="rulesBtn" type="button">📖 Reglas</button>
    </footer>
  </section>

  <!-- Modal de reglas (sobre toda la app) -->
  <div id="rulesModal" hidden>
    <div class="rules-inner">
      <button id="rulesClose" type="button">✕ Cerrar</button>
      <iframe id="rulesFrame" title="Reglas de Sombras sobre Londres"></iframe>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="client.js"></script>
</body>
</html>
